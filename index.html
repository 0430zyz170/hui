<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>听禹回响 - 电影感养成游戏</title>
    <style>
        /* ===== 全局样式 ===== */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background-color: #0d110d; /* 极暗墨绿背景 */
            color: #d4e0d4;
            font-family: "Microsoft YaHei", "PingFang SC", "STZhongsong", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 12px 0; /* 让手机上下留一点呼吸感 */
        }

        /* ===== 开头电影胶卷动画 ===== */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #0b0e0b;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 2s ease-in-out, visibility 2s;
        }
        #intro-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 电影胶片边框 */
        .film-strip {
            position: absolute;
            top: 0; bottom: 0;
            width: 80px;
            background-color: #131813;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 20px, #2a3b2a 20px, #2a3b2a 40px);
            border-left: 2px solid #1a231a;
            border-right: 2px solid #1a231a;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .film-strip.left { left: 0; }
        .film-strip.right { right: 0; }

        /* 胶卷中心内容 */
        .intro-content {
            text-align: center;
            animation: introZoom 6s ease-out forwards;
        }
        .intro-title {
            font-size: 4rem;
            color: #7faa7f; /* 高级灰绿色 */
            letter-spacing: 15px;
            margin: 0;
            text-shadow: 0 0 30px rgba(127, 170, 127, 0.4);
            font-weight: 300;
            opacity: 0;
            animation: fadeInText 3s ease 1s forwards;
        }
        .intro-subtitle {
            font-size: 1rem;
            color: #4a634a;
            letter-spacing: 8px;
            margin-top: 20px;
            opacity: 0;
            animation: fadeInText 3s ease 3s forwards;
        }

        /* 光影扫过效果 */
        .light-sweep {
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(127, 170, 127, 0.05), transparent);
            transform: skewX(-20deg);
            animation: sweep 4s ease-in-out 2s forwards;
        }

        @keyframes introZoom {
            0% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes sweep {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        /* ===== 主游戏容器 ===== */
        #game-container {
            width: 100%;
            max-width: 430px; /* 手机屏幕宽度 */
            height: min(94vh, 880px); /* 固定屏幕高度，内容向下滑动 */
            background: linear-gradient(135deg, #161b16, #0f130f);
            border-radius: 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 0 1px #2a3b2a;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            display: none; /* 开场动画结束后显示 */
            scrollbar-width: thin;
            scrollbar-color: #2a3b2a transparent;
        }
        #game-container::-webkit-scrollbar { width: 4px; }
        #game-container::-webkit-scrollbar-thumb { background: #2a3b2a; border-radius: 2px; }
        #game-container.active { display: block; }

        /* ===== 顶部状态栏 ===== */
        #status-bar {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            background-color: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid #2a3b2a;
            font-size: 14px;
            font-family: "PingFang SC", sans-serif;
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8fa38f;
        }
        .stat-bar {
            width: 60px;
            height: 4px;
            background: #1a231a;
            border-radius: 2px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-out;
        }
        #stat-warm .stat-fill { background: #cc9c52; }
        #stat-tough .stat-fill { background: #6b9c9c; }
        #stat-fans .stat-fill { background: #9c6b6b; }

        /* ===== 存档/读档按钮 ===== */
        #save-controls {
            position: absolute;
            top: 15px;
            right: 25px;
            display: flex;
            gap: 10px;
        }
        .btn-save {
            background: transparent;
            color: #5c6e5c;
            border: 1px solid #2a3b2a;
            padding: 4px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-save:hover {
            color: #a4c2a4;
            border-color: #7faa7f;
            background: rgba(127, 170, 127, 0.05);
        }

        /* ===== 主内容区 ===== */
        #story-area {
            padding: 40px 60px;
            min-height: 400px;
            font-size: 17px;
            line-height: 2.1;
            letter-spacing: 0.5px;
            position: relative;
            background-image: radial-gradient(circle at center, rgba(127, 170, 127, 0.03) 0%, transparent 70%);
        }

        #chapter-title {
            font-size: 20px;
            color: #7faa7f;
            margin-bottom: 25px;
            font-weight: bold;
            letter-spacing: 2px;
            border-left: 3px solid #7faa7f;
            padding-left: 12px;
        }

        #text-display {
            white-space: pre-wrap;
            margin-bottom: 30px;
            text-align: justify;
            color: #c0cfc0;
        }

        /* ===== 交互选项区 ===== */
        #choices-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .choice-btn {
            background: rgba(127, 170, 127, 0.03);
            border: 1px solid #2a3b2a;
            color: #a4c2a4;
            padding: 16px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            text-align: left;
            transition: 0.4s;
            font-family: inherit;
            letter-spacing: 1px;
        }
        .choice-btn:hover {
            background: rgba(127, 170, 127, 0.08);
            border-color: #7faa7f;
            color: #d4e0d4;
            transform: translateX(8px);
            box-shadow: 0 0 15px rgba(127, 170, 127, 0.1);
        }

        /* ===== 音乐控制 ===== */
        #music-toggle {
            position: absolute;
            bottom: 20px;
            right: 25px;
            background: transparent;
            border: none;
            color: #5c6e5c;
            cursor: pointer;
            font-size: 22px;
            transition: 0.3s;
        }
        #music-toggle:hover { color: #7faa7f; }

        /* ===== 成长相册（图片依尺寸由小到大排列） ===== */
        #gallery-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(8, 11, 8, 0.97);
            display: none;
            flex-direction: column;
            padding: 30px 40px;
        }
        #gallery-overlay.show { display: flex; }
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-shrink: 0;
        }
        .gallery-header h2 {
            color: #7faa7f;
            font-weight: 300;
            letter-spacing: 4px;
            font-size: 22px;
            margin: 0;
        }
        .gallery-close {
            background: transparent;
            border: 1px solid #2a3b2a;
            color: #8fa38f;
            border-radius: 4px;
            padding: 6px 14px;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            transition: 0.3s;
        }
        .gallery-close:hover { color: #d4e0d4; border-color: #7faa7f; }
        #gallery-grid {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 22px;
            overflow-y: auto;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 30px;
        }
        .photo-card {
            background: rgba(127, 170, 127, 0.03);
            border: 1px solid #2a3b2a;
            border-radius: 6px;
            padding: 10px;
            transition: transform 0.4s, box-shadow 0.4s, border-color 0.4s;
        }
        .photo-card:hover {
            transform: translateY(-6px);
            border-color: #7faa7f;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 18px rgba(127,170,127,0.15);
        }
        /* 卡片宽度随排序递增，视觉上直观体现“由小到大” */
        .photo-card:nth-child(1) { width: clamp(120px, 14vw, 160px); }
        .photo-card:nth-child(2) { width: clamp(140px, 17vw, 195px); }
        .photo-card:nth-child(3) { width: clamp(160px, 20vw, 230px); }
        .photo-card:nth-child(4) { width: clamp(180px, 22vw, 255px); }
        .photo-card:nth-child(5) { width: clamp(200px, 24vw, 285px); }
        .photo-wrap {
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            display: flex;
        }
        .photo-wrap img {
            display: block;
            width: 100%;
            height: auto;
            cursor: zoom-in;
            filter: saturate(0.92);
        }
        .photo-rank {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(11, 14, 11, 0.78);
            border: 1px solid #4a634a;
            color: #a4c2a4;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            letter-spacing: 1px;
        }
        .photo-info {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
            font-size: 12px;
            color: #8fa38f;
        }
        .photo-tag { color: #a4c2a4; letter-spacing: 2px; white-space: nowrap; }

        /* 点击大图 */
        #lightbox {
            position: fixed;
            inset: 0;
            z-index: 10001;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        #lightbox.show { display: flex; }
        #lightbox img {
            max-width: 92vw;
            max-height: 88vh;
            border-radius: 6px;
            box-shadow: 0 0 60px rgba(127, 170, 127, 0.2);
        }
        .lightbox-caption {
            position: absolute;
            bottom: 26px;
            left: 0;
            right: 0;
            text-align: center;
            color: #a4c2a4;
            letter-spacing: 3px;
            font-size: 14px;
        }

        /* ===== 章节进度条 ===== */
        #progress-track { height: 3px; background: #1a231a; }
        #progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a634a, #7faa7f);
            transition: width 0.8s ease;
        }

        /* ===== 打字快进提示 ===== */
        #type-hint {
            display: none;
            text-align: right;
            font-size: 11px;
            color: #4a634a;
            letter-spacing: 2px;
            margin-top: -14px;
            margin-bottom: 12px;
            animation: hintBlink 1.6s infinite;
        }
        #type-hint.show { display: block; }
        @keyframes hintBlink { 0%,100% { opacity: .35; } 50% { opacity: .9; } }

        /* ===== 选项序号键 ===== */
        .choice-key {
            display: inline-block;
            min-width: 20px;
            height: 20px;
            line-height: 20px;
            text-align: center;
            margin-right: 12px;
            border: 1px solid #4a634a;
            border-radius: 4px;
            font-size: 12px;
            color: #7faa7f;
            background: rgba(0,0,0,0.3);
            vertical-align: 1px;
        }
        .choice-btn:active { transform: translateX(8px) scale(0.98); }

        /* ===== 属性浮动反馈 ===== */
        .stat-float {
            position: fixed;
            z-index: 10003;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            pointer-events: none;
            animation: floatUp 1.5s ease-out forwards;
        }
        .stat-float-warm { color: #cc9c52; }
        .stat-float-tough { color: #6b9c9c; }
        .stat-float-fans { color: #c98a8a; }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0); }
            15% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-70px); }
        }
        .stat-item.pulse { animation: statPulse .6s ease; }
        @keyframes statPulse {
            0% { transform: scale(1); }
            40% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* ===== 章节配图（页内悬浮照片） ===== */
        .chapter-photo {
            float: right;
            width: 148px;
            margin: 0 0 16px 22px;
            background: rgba(127,170,127,0.05);
            border: 1px solid #2a3b2a;
            border-radius: 6px;
            padding: 8px;
            transform: rotate(2.5deg);
            box-shadow: 0 8px 24px rgba(0,0,0,0.55);
            cursor: zoom-in;
            transition: transform .35s, box-shadow .35s, border-color .35s;
        }
        .chapter-photo:hover {
            transform: rotate(0deg) scale(1.04);
            border-color: #7faa7f;
            box-shadow: 0 12px 30px rgba(0,0,0,0.65), 0 0 16px rgba(127,170,127,0.18);
        }
        .chapter-photo img { display: block; width: 100%; border-radius: 4px; filter: saturate(0.92); }
        .chapter-photo-cap { margin-top: 6px; font-size: 11px; color: #8fa38f; letter-spacing: 2px; text-align: center; }
        #chapter-photo-wrap:empty { display: none; }

        /* ===== 18岁 · 红色腕带黑屏手表倒计时 ===== */
        #watch-overlay {
            position: fixed;
            inset: 0;
            z-index: 10002;
            background: rgba(5, 8, 5, 0.94);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 26px;
        }
        #watch-overlay.show { display: flex; }
        .watch { display: flex; flex-direction: column; align-items: center; animation: watchIn .9s ease; }
        @keyframes watchIn { 0% { opacity: 0; transform: translateY(30px) scale(.9); } 100% { opacity: 1; transform: none; } }
        .watch-strap {
            width: 92px;
            height: 74px;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 14px, rgba(0,0,0,0.28) 14px, rgba(0,0,0,0.28) 17px),
                linear-gradient(90deg, #8f1d12 0%, #d63a2f 18%, #e2483a 50%, #d63a2f 82%, #8f1d12 100%);
            box-shadow: inset 3px 0 6px rgba(0,0,0,0.45), inset -3px 0 6px rgba(0,0,0,0.45);
        }
        .watch-strap.top { border-radius: 14px 14px 0 0; }
        .watch-strap.bottom { border-radius: 0 0 14px 14px; }
        .watch-face {
            width: 208px;
            height: 208px;
            border-radius: 50%;
            background: #161616;
            border: 9px solid #262626;
            box-shadow: 0 0 0 3px #3a3a3a, 0 24px 70px rgba(0,0,0,0.85), inset 0 0 24px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -8px 0;
            position: relative;
            z-index: 2;
        }
        .watch-screen {
            width: 158px;
            height: 96px;
            background: #000;
            border-radius: 12px;
            border: 2px solid #1d1d1d;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 26px rgba(255, 59, 48, 0.12);
        }
        .watch-label { font-size: 9px; color: #8a322b; letter-spacing: 3px; margin-bottom: 6px; font-family: "Courier New", monospace; }
        #watch-digits {
            font-family: "Courier New", monospace;
            font-size: 34px;
            font-weight: bold;
            color: #ff3b30;
            text-shadow: 0 0 14px rgba(255, 59, 48, 0.85);
            letter-spacing: 2px;
        }
        .watch-hr { margin-top: 6px; font-size: 10px; color: #a03a32; font-family: "Courier New", monospace; }
        .watch-hr b { color: #ff3b30; animation: heartbeat .8s infinite; display: inline-block; }
        @keyframes heartbeat { 0%,100% { transform: scale(1); } 25% { transform: scale(1.35); } 45% { transform: scale(1); } }
        #watch-msg {
            min-height: 30px;
            font-size: 20px;
            letter-spacing: 6px;
            color: #ffb3ab;
            text-shadow: 0 0 18px rgba(255, 59, 48, 0.5);
            opacity: 0;
            transition: opacity .6s;
        }
        #watch-overlay.watch-done #watch-msg { opacity: 1; }
        #watch-overlay.watch-done #watch-digits { animation: digitFlash .35s 5 alternate; }
        #watch-overlay.watch-done .watch { animation: watchShake .6s ease; }
        @keyframes digitFlash { from { opacity: 1; } to { opacity: 0.25; } }
        @keyframes watchShake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-6px) rotate(-1.5deg); }
            40% { transform: translateX(6px) rotate(1.5deg); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        #watch-skip { position: absolute; bottom: 40px; right: 40px; }

        /* ===== 开场跳过提示 ===== */
        .intro-skip {
            position: absolute;
            bottom: 34px;
            left: 0; right: 0;
            text-align: center;
            font-size: 12px;
            color: #3a4a3a;
            letter-spacing: 4px;
            animation: hintBlink 2s infinite;
        }
        #intro-overlay { cursor: pointer; }

        /* ===== 手机端适配 ===== */
        @media (max-width: 640px) {
            body { padding: 0; overflow: hidden; }
            .film-strip { width: 26px; }
            .intro-title { font-size: 2rem; letter-spacing: 8px; }
            .intro-subtitle { font-size: 0.8rem; letter-spacing: 4px; }
            #game-container { border-radius: 0; max-width: 100vw; height: 100vh; }
            #status-bar { flex-wrap: wrap; gap: 6px 12px; padding: 10px 14px; font-size: 12px; }
            .stat-bar { width: 42px; }
            #save-controls {
                position: static;
                justify-content: center;
                gap: 8px;
                padding: 8px 10px;
                background: rgba(0,0,0,0.35);
                border-bottom: 1px solid #2a3b2a;
            }
            #story-area { padding: 22px 16px 60px; font-size: 15px; line-height: 1.95; min-height: 300px; }
            .chapter-photo { float: none; width: 62%; margin: 0 auto 16px; transform: rotate(1.5deg); }
            .choice-btn { padding: 14px 16px; font-size: 14px; }
            .choice-key { display: none; }
            #gallery-overlay { padding: 16px 12px; }
            #gallery-grid { gap: 14px; }
            #music-toggle { bottom: 12px; right: 14px; }
            .watch-face { width: 172px; height: 172px; }
            .watch-screen { width: 134px; height: 84px; }
            #watch-digits { font-size: 28px; }
            .watch-strap { width: 78px; height: 60px; }
            #watch-skip { bottom: 24px; right: 20px; }
        }

        /* ===== 动画 ===== */
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!-- ===== 开场绿色胶卷动画 ===== -->
<div id="intro-overlay">
    <div class="film-strip left"></div>
    <div class="film-strip right"></div>
    <div class="light-sweep"></div>
    <div class="intro-content">
        <h1 class="intro-title">听禹回响</h1>
        <p class="intro-subtitle">TEENAGE DREAM · 2007-2026</p>
    </div>
    <div class="intro-skip">点 击 进 入 »</div>
</div>

<!-- ===== 主游戏界面 ===== -->
<div id="game-container">
    <!-- 顶部状态栏 -->
    <div id="status-bar">
        <div class="stat-item">📅 年龄：<span id="stat-age">0</span></div>
        <div class="stat-item" id="stat-warm">🔥 温暖：<div class="stat-bar"><div class="stat-fill" id="fill-warm"></div></div><span id="val-warm">0</span></div>
        <div class="stat-item" id="stat-tough">🛡️ 坚韧：<div class="stat-bar"><div class="stat-fill" id="fill-tough"></div></div><span id="val-tough">0</span></div>
        <div class="stat-item" id="stat-fans">🌟 粉丝：<div class="stat-bar"><div class="stat-fill" id="fill-fans"></div></div><span id="val-fans">0</span></div>
    </div>

    <!-- 章节进度条 -->
    <div id="progress-track"><div id="progress-fill"></div></div>

    <!-- 存档按钮 -->
    <div id="save-controls">
        <button class="btn-save" onclick="saveGame()">💾 存档</button>
        <button class="btn-save" onclick="loadGame()">📂 读档</button>
        <button class="btn-save" onclick="restartGame()">🔄 重来</button>
        <button class="btn-save" onclick="openGallery()">📷 相册</button>
    </div>

    <!-- 故事内容区 -->
    <div id="story-area">
        <div id="chapter-title"></div>
        <div id="chapter-photo-wrap"></div>
        <div id="text-display"></div>
        <div id="type-hint">💡 点击文字可快进</div>
        <div id="choices-area"></div>
    </div>

    <!-- 音乐按钮 -->
    <button id="music-toggle" onclick="toggleBGM()">🔇</button>
</div>

<!-- ===== 成长相册弹层（图片按尺寸由小到大排列） ===== -->
<div id="gallery-overlay">
    <div class="gallery-header">
        <h2>成长相册 · 按年龄从小到大</h2>

        const data = buf.getChannelData(c);
        for (let i = 0; i < len; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
        }
    }
    conv.buffer = buf;

    const dry = audioCtx.createGain();
    dry.gain.value = 0.85;
    const wet = audioCtx.createGain();
    wet.gain.value = 0.35;

    musicBus = audioCtx.createGain();
    musicBus.gain.value = 0.0001;
    musicBus.connect(dry);
    dry.connect(audioCtx.destination);
    musicBus.connect(conv);
    conv.connect(wet);
    wet.connect(audioCtx.destination);
}

// 柔和钢琴音色：正弦基音 + 三角波八度泛音
function playTone(freq, start, durBeats, volume) {
    const dur = durBeats * BEAT;
    const osc1 = audioCtx.createOscillator();
    const osc2 = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    const g2 = audioCtx.createGain();
    osc1.type = 'sine';
    osc1.frequency.value = freq;
    osc2.type = 'triangle';
    osc2.frequency.value = freq * 2;
    g2.gain.value = 0.18;
    osc1.connect(g);
    osc2.connect(g2);
    g2.connect(g);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(volume, start + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    g.connect(musicBus);
    osc1.start(start);
    osc2.start(start);
    osc1.stop(start + dur + 0.1);
    osc2.stop(start + dur + 0.1);
}

// 铺底 pad：缓慢起伏的正弦和弦
function playPad(freqs, start, dur) {
    freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = f;
        osc.detune.value = i === 0 ? -4 : 5;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.linearRampToValueAtTime(0.022, start + dur * 0.35);
        g.gain.linearRampToValueAtTime(0.0001, start + dur);
        osc.connect(g);
        g.connect(musicBus);
        osc.start(start);
        osc.stop(start + dur + 0.1);
    });
}

function scheduleBar(bar, time) {
    const ch = chords[bar];
    playPad(ch.pad, time, 4 * BEAT);                    // 铺底和弦
    playTone(ch.root, time, 2, 0.09);                   // 根音
    playTone(ch.root * 2, time + 2 * BEAT, 1.5, 0.05); // 低音呼应
    melody[bar].forEach(n => {
        playTone(n.f, time + n.b * BEAT, n.d, 0.11);    // 旋律
    });
}

function startBGM() {
    initAudioEngine();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (isBgmPlaying) return;

    schedBar = 0;
    schedBeat = 0;
    nextBeatTime = audioCtx.currentTime + 0.15;
    bgmTimer = setInterval(() => {
        while (nextBeatTime < audioCtx.currentTime + 0.25) {
            if (schedBeat === 0) scheduleBar(schedBar, nextBeatTime);
            nextBeatTime += BEAT;
            schedBeat++;
            if (schedBeat >= 4) {
                schedBeat = 0;
                schedBar = (schedBar + 1) % chords.length;
            }
        }
    }, 80);

    musicBus.gain.cancelScheduledValues(audioCtx.currentTime);
    musicBus.gain.setValueAtTime(Math.max(musicBus.gain.value, 0.0001), audioCtx.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.9, audioCtx.currentTime + 2.5);
    isBgmPlaying = true;
    updateMusicBtn(true);
}

function stopBGM() {
    if (!audioCtx) return;
    clearInterval(bgmTimer);
    musicBus.gain.cancelScheduledValues(audioCtx.currentTime);
    musicBus.gain.setValueAtTime(musicBus.gain.value, audioCtx.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
    isBgmPlaying = false;
    updateMusicBtn(false);
}

function updateMusicBtn(playing) {
    const btn = document.getElementById('music-toggle');
    if (btn) btn.innerText = playing ? "🎵" : "🔇";
}

function toggleBGM() {
    if (isBgmPlaying) stopBGM();
    else startBGM();
}

// ===== 属性浮动反馈 =====
function spawnStatFloats(targetBtn, effect) {
    const rect = targetBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top;
    const icons = { warm: '🔥+', tough: '🛡️+', fans: '🌟+' };
    const names = { warm: 'warm', tough: 'tough', fans: 'fans' };
    let offset = 0;
    Object.entries(effect).forEach(([k, v]) => {
        if (v === 0) return;
        const el = document.createElement('div');
        el.className = 'stat-float stat-float-' + names[k];
        el.innerText = icons[k] + v;
        el.style.left = (cx + offset) + 'px';
        el.style.top = cy + 'px';
        document.body.appendChild(el);
        offset += 58;
        setTimeout(() => el.remove(), 1500);
    });
}

function pulseStat(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.remove('pulse');
    void el.offsetWidth; // reflow
    el.classList.add('pulse');
}

// ===== 18岁红色腕带黑屏手表倒计时 =====
let watchTimer = null;
function playWatchCountdown(onComplete) {
    const ov = document.getElementById('watch-overlay');
    const digits = document.getElementById('watch-digits');
    const msg = document.getElementById('watch-msg');
    const skipBtn = document.getElementById('watch-skip');

    ov.classList.add('show');
    ov.classList.remove('watch-done');
    msg.innerText = '';

    let remain = 10.0;
    digits.innerText = '00:10.0';

    function fmt(t) {
        const s = Math.floor(t);
        const d = Math.floor((t % 1) * 10);
        return (s < 10 ? '00:0' : '00:') + s + '.' + d;
    }

    function done() {
        clearInterval(watchTimer);
        digits.innerText = '00:00.0';
        ov.classList.add('watch-done');
        msg.innerText = '十 八 · 成 年 了';
        setTimeout(() => {
            ov.classList.remove('show');
            ov.classList.remove('watch-done');
            if (onComplete) onComplete();
        }, 2400);
    }

    const skip = () => {
        clearInterval(watchTimer);
        ov.classList.remove('show');
        ov.classList.remove('watch-done');
        if (onComplete) onComplete();
    };
    skipBtn.onclick = skip;
    ov.onclick = (e) => { if (e.target === ov) skip(); };

    watchTimer = setInterval(() => {
        remain -= 0.05;
        if (remain <= 0) { done(); }
        else digits.innerText = fmt(remain);
    }, 50);
}

let typing = false, fullText = '', typeDone = null;
const typeHint = document.getElementById('type-hint');

function typeWriter(text, callback) {
    textEl.innerHTML = '';
    fullText = text;
    typeDone = callback;
    typing = true;
    typeHint.classList.add('show');
    let i = 0;
    const speed = 45;

    function type() {
        if (i < text.length) {
            textEl.innerHTML += text.charAt(i);
            if (i % 3 === 0) playSound('type'); // 打字音效
            i++;
            typeWriterTimer = setTimeout(type, speed);
        } else {
            finishTyping();
        }
    }
    type();
}

function finishTyping() {
    if (!typing) return;
    typing = false;
    clearTimeout(typeWriterTimer);
    textEl.innerText = fullText;
    typeHint.classList.remove('show');
    const cb = typeDone;
    typeDone = null;
    if (cb) cb();
}

// 点击文字立即显示全文（快进）
textEl.style.cursor = 'pointer';
textEl.addEventListener('click', () => { if (typing) finishTyping(); });

function loadChapter(index) {
    if (index >= storyScript.length) {
        showEnding();
        return;
    }

    const chapter = storyScript[index];
    gameState.currentChapter = index;
    titleEl.innerText = chapter.title;
    choicesEl.innerHTML = '';

    // 更新年龄映射（0-10章的年龄跨度）
    const ageMap = [0, 1, 2, 8, 14, 16, 17, 17, 18, 18, 19];
    gameState.age = ageMap[index] || 19;

    updateStats();
    document.getElementById('progress-fill').style.width = ((index + 1) / storyScript.length * 100) + '%';

    // 章节配图（页内展示，点击可放大）
    renderChapterPhoto(index);

    clearTimeout(typeWriterTimer);
    const startTyping = () => typeWriter(chapter.text, () => showChapterChoices(chapter, index));

    // 18岁成年章：先播放红色腕带黑屏手表倒计时
    if (index === 8 && !gameState.watchShown) {
        gameState.watchShown = true;
        playWatchCountdown(startTyping);
    } else {
        startTyping();
    }
}

function showChapterChoices(chapter, index) {
    if (chapter.choices) {
        chapter.choices.forEach((choice, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn fade-in';
            btn.innerHTML = `<span class="choice-key">${idx + 1}</span>${choice.text}`;
            btn.onclick = () => {
                playSound('click');
                gameState.stats.warm += choice.effect.warm;
                gameState.stats.tough += choice.effect.tough;
                gameState.stats.fans += choice.effect.fans;
                updateStats();
                spawnStatFloats(btn, choice.effect);
                ['warm', 'tough', 'fans'].forEach(k => { if (choice.effect[k]) pulseStat('stat-' + k); });

                choicesEl.innerHTML = '';
                const replyDiv = document.createElement('div');
                replyDiv.className = 'fade-in';
                replyDiv.style.color = '#7faa7f';
                replyDiv.style.marginTop = '15px';
                replyDiv.style.paddingLeft = '10px';
                replyDiv.style.borderLeft = '2px solid #4a634a';
                replyDiv.innerText = `💬 ${choice.reply}`;
                choicesEl.appendChild(replyDiv);

                setTimeout(() => {
                    loadChapter(index + 1);
                }, 2800);
            };
            choicesEl.appendChild(btn);
        });
    } else {
        const nextBtn = document.createElement('button');
        nextBtn.className = 'choice-btn fade-in';
        nextBtn.innerHTML = '▶ 继续... <span class="choice-key">⏎</span>';
        nextBtn.style.textAlign = 'center';
        nextBtn.onclick = () => {
            playSound('click');
            loadChapter(index + 1);
        };
        choicesEl.appendChild(nextBtn);
    }
}

function showEnding() {
    titleEl.innerText = "【尾声：听禹回响】";
    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('chapter-photo-wrap').innerHTML = '';
    let endingText = "";
    if (gameState.stats.tough >= 60) {
        endingText = `18岁的大禹，带着坚韧值 ${gameState.stats.tough}，温暖值 ${gameState.stats.warm}，粉丝值 ${gameState.stats.fans}，继续前行。\n\n【结局：展翅高飞】\n那些被推掉的邀约、深夜的眼泪，最终都没能拦住他的脚步。大禹把所有的遗憾化为动力，在舞台上一次又一次证明了自己。未来的路还很长，但属于他的回响，才刚刚开始。`;
    } else if (gameState.stats.warm >= 50) {
        endingText = `18岁的大禹，带着温暖值 ${gameState.stats.warm}，坚韧值 ${gameState.stats.tough}，粉丝值 ${gameState.stats.fans}，继续前行。\n\n【结局：爱的羽翼】\n家人和粉丝的爱是他最坚硬的铠甲。那些说不出口的委屈、那些独自咽下的苦楚，都在那份沉甸甸的守护中变得不再沉重。无论前方如何，他都不是孤身一人。`;
    } else {
        endingText = `18岁的大禹，带着成长的一切，继续前行。\n\n【结局：凡人之路】\n也许没有惊天动地，但他依然在踏实地走着。经历过低谷，也见过微光。每一步，都作数。\n\n十九岁的他，还在向前。`;
    }
    
    textEl.innerHTML = '';
    typeWriter(endingText + "\n\n🎵 感谢游玩《听禹回响》，见证少年的成长。", null);
    choicesEl.innerHTML = '';
    const restartBtn = document.createElement('button');
    restartBtn.className = 'choice-btn fade-in';
    restartBtn.innerText = "🔄 重新开始";
    restartBtn.style.textAlign = 'center';
    restartBtn.onclick = () => { restartGame(); };
    choicesEl.appendChild(restartBtn);
}

// 5. 存档/读档
function saveGame() {
    playSound('click');
    const saveData = {
        age: gameState.age,
        stats: gameState.stats,
        currentChapter: gameState.currentChapter
    };
    localStorage.setItem('tingyu_save_final', JSON.stringify(saveData));
    alert("✅ 游戏进度已保存！");
}

function loadGame() {
    playSound('click');
    const saved = localStorage.getItem('tingyu_save_final');
    if (saved) {
        const data = JSON.parse(saved);
        gameState.age = data.age;
        gameState.stats = data.stats;
        updateStats();
        loadChapter(data.currentChapter);
        alert("📂 存档读取成功！");
    } else {
        alert("❌ 没有找到存档记录。");
    }
}

function restartGame() {
    playSound('click');
    gameState.age = 0;
    gameState.stats = { warm: 0, tough: 0, fans: 0 };
    gameState.currentChapter = 0;
    updateStats();
    loadChapter(0);
}

// ===== 开场动画与初始化 =====
window.onload = () => {
    let started = false;
    const startGame = () => {
        if (started) return;
        started = true;
        document.getElementById('intro-overlay').classList.add('hidden');
        document.getElementById('game-container').classList.add('active');
        restartGame(); // 开始游戏
    };

    setTimeout(startGame, 6000);
    document.getElementById('intro-overlay').addEventListener('click', startGame);

    // 浏览器自动播放策略：首次交互（点击音乐按钮除外）时自动响起 BGM
    document.addEventListener('pointerdown', (e) => {
        if (e.target.closest && e.target.closest('#music-toggle')) return;
        startBGM();
    }, { once: true });

    // ESC 关闭相册 / 大图 / 跳过手表

        if (e.key === 'Escape') {
            document.getElementById('lightbox').classList.remove('show');

            const ov = document.getElementById('watch-overlay');
            if (ov.classList.contains('show')) {
                const skipBtn = document.getElementById('watch-skip');
                if (skipBtn) skipBtn.click();
            }

    });
